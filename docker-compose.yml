# Local production-like stack: Postgres + app + worker.
# Copy .env.example to .env and fill in the required values before `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amplifi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: amplifi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amplifi -d amplifi"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?set APP_URL to the public https URL}
      DATABASE_URL: postgresql://amplifi:${POSTGRES_PASSWORD}@db:5432/amplifi
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-Amplifi <no-reply@example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      DEMO_MODE: "false"
      DEMO_AUTO_VERIFY_EMAIL: "false"
      INLINE_WORKER: "false"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/.data/uploads

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://amplifi:${POSTGRES_PASSWORD}@db:5432/amplifi
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      DEMO_MODE: "false"
      INLINE_WORKER: "false"

volumes:
  db-data:
  uploads:
