<!--
  ============================================================================
  SUPER OVER BLITZ — single-file, offline, mobile-first cricket game
  ----------------------------------------------------------------------------
  • HTML5 Canvas + vanilla JS only. No external files, fonts, images or audio.
  • Everything (crowd, sounds, confetti, fireworks) is generated in code.
  • Architecture (search for "SECTION" banners):
      1 UTILS      tiny helpers
      2 STORAGE    localStorage progress (try/catch wrapped)
      3 I18N       English / हिन्दी strings
      4 DATA       shop items, ball types, 50-level curve, Hinglish commentary
      5 AUDIO      Web Audio API synth (bat hits, crowd cheers, UI)
      6 ADS        MONETIZATION STUBS (fake 3s ads) — replace with real SDK
      7 SHOP       bats / trails / stadiums / premium (stub purchase)
      8 GAME       state machine, deliveries, timing windows, scoring
      9 RENDER     canvas scene, particles, screen shake, slow-mo, confetti
     10 UI         screens, modals, tutorial, daily reward, share
     11 INPUT/BOOT tap + spacebar + pause, main loop
  • TWEAK: search the word "TWEAK" for every knob worth playing with.
  ----------------------------------------------------------------------------
  Ready to wrap with Capacitor or a Trusted Web Activity as-is.
-->
<style>
/* ===================== BASE ===================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0d14}
body{

  -webkit-user-select:none;user-select:none;
}
#stage{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;display:block;touch-action:none}
#tapzone{position:absolute;inset:0;z-index:5;touch-action:none}
.hidden{display:none!important}
button{cursor:pointer}

/* ===================== HUD ===================== */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;

.resList .rl{display:flex;justify-content:space-between;padding:3px 0;opacity:.9}

/* ===================== MODAL / TOAST ===================== */

  padding:20px;pointer-events:auto;z-index:31}

  text-align:center;display:flex;flex-direction:column;gap:10px;animation:scrIn .2s ease}

  z-index:60;background:#1b2330f2;border:1px solid #ffffff30;color:#fff;padding:10px 18px;border-radius:999px;
  font-weight:700;font-size:13.5px;max-width:86%;text-align:center;box-shadow:0 6px 20px #00000066}

/* ===================== FAKE AD OVERLAY ===================== */
#adOverlay{position:absolute;inset:0;z-index:40;background:#000000d9;display:flex;align-items:center;justify-content:center;padding:20px}
.adBox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.adTag{font-size:11px;font-weight:800;letter-spacing:1px;color:#fab005;text-align:center}

.adRow{display:flex;justify-content:space-between;align-items:center}
#adCount{font-weight:800;font-size:13px}
</style>

<script>
"use strict";
/* =====================================================================
   SECTION 1 · UTILS — tiny helpers used everywhere
   ===================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,p) => a+(b-a)*p;
const rnd   = (a,b) => a+Math.random()*(b-a);
const rndi  = (a,b) => Math.floor(rnd(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const smoothstep = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeOutQuad = t => 1-(1-t)*(1-t);
const easeOutBack = t => { const c=1.70158; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };

/** Deterministic RNG (mulberry32) — used for the date-seeded Daily Challenge. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function yesterdayKey(){const d=new Date(Date.now()-864e5);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function shortDate(){return new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'});}
/** roundRect polyfill-path (kept manual for old Android WebView). */
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/** lighten/darken a #rrggbb colour by amt (-255..255). */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';}
/* =====================================================================
   SECTION 2 · STORAGE — all progress in localStorage, always try/catch
   (private-mode / quota errors must never crash the game)
   ===================================================================== */
const Storage={
  KEY:'superoverblitz_save_v1',
  d:null,
  defaults(){return{
    v:1,
    coins:120,                 // TWEAK: starting coins
    lang:'en',                 // 'en' | 'hi'
    sound:true,
    festival:'classic',        // 'classic' | 'diwali' | 'ipl'
    bat:'willow', trail:'none', stadium:'mumbai',
    isPremium:false,           // MONETIZATION: single premium flag (stub purchase)
    owned:{bats:['willow'],trails:['none'],stadiums:['mumbai']},
    stars:{},                  // level number -> 0..3
    best:{endless:0,super:0},
    daily:{date:0,done:false,margin:-999},
    login:{date:0,streak:0},   // daily login reward
    board:[],                  // local leaderboard entries
    tutorial:false,
    matches:0
  };},
  load(){
    let d=null;
    try{const raw=localStorage.getItem(this.KEY);if(raw)d=JSON.parse(raw);}catch(e){d=null;}
    this.d=(d&&d.v===1)?d:this.defaults();
    // heal any missing keys (forward-compat with future save edits)
    const def=this.defaults();
    for(const k in def)if(this.d[k]===undefined)this.d[k]=def[k];
    return this.d;
  },
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.d));}catch(e){/* ignore */}},
  wipe(){ // in-place reset so the DB alias stays valid
    try{localStorage.removeItem(this.KEY);}catch(e){}
    const def=this.defaults();
    for(const k in def)this.d[k]=def[k];
    this.save();
  }
};
const DB=Storage.load();
/* =====================================================================
   SECTION 3 · I18N — English / हिन्दी UI strings.
   Commentary stays Hinglish in both languages — that's the flavour!
   ===================================================================== */
const I18N={
en:{

  resetDone:'Progress reset.',
  youWin:'YOU WIN! 🏆',youLose:'MATCH LOST',gameOver:'ALL OUT!',levelCleared:'LEVEL CLEARED!',
  playAgain:'▶ Play Again',doubleCoins:'🎁 Double coins (ad)',share:'📤 Share Score',

const LVL={
  travel:n=>1060-n*7,                        // base ball travel ms (L1≈1053 → L50≈710)
  w1:n=>46-n*0.28,                           // SIX window ±ms      (L1≈46 → L50≈32)
  w2:n=>96-n*0.6,                            // FOUR window ±ms     (L1≈96 → L50≈66)
  w3:n=>165-n*0.9,                           // 2-runs window ±ms
  w4:n=>235-n*0.7,                           // 1-run window ±ms
  outChance:n=>Math.min(0.6,0.3+n*0.006),    // chance a wild miss is OUT
  target:n=>clamp(Math.round(6+n*0.36+Math.sin(n*1.7)*1.5),6,24) // runs to chase in 6 balls
};

/* Which ball types can appear at a given difficulty level, with weights. */
function typeWeights(lvl){
  const w={fast:3,slow:2};
  if(lvl>=3)w.swing=2; if(lvl>=6)w.spin=2; if(lvl>=9)w.bouncer=1.5; if(lvl>=12)w.yorker=1.5;
  if(lvl>=18){w.slow=1;w.swing=2.5;}
  if(lvl>=30){w.yorker=2.5;w.bouncer=2;w.spin=2.5;w.fast=2;}
  return w;
}
function pickType(lvl,rng){
  rng=rng||Math.random;
  const w=typeWeights(lvl);let tot=0;for(const k in w)tot+=w[k];
  let r=rng()*tot;
  for(const k in w){r-=w[k];if(r<=0)return k;}
  return 'fast';
}

/* =====================================================================
   SECTION 5 · AUDIO — every sound is synthesised with the Web Audio API.
   No audio files anywhere. iOS needs the context created inside a user
   gesture, so ensure() is called from every tap/click handler.
   ===================================================================== */
const AudioSys={
  ctx:null,master:null,noiseBuf:null,ambient:null,
  ensure(){
    if(this.ctx){if(this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}return;}
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=DB.sound?0.6:0;
      this.master.connect(this.ctx.destination);
      // 1s of white noise, reused by every noise-based sound
      const len=this.ctx.sampleRate;
      const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const ch=buf.getChannelData(0);
      for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }catch(e){/* audio unsupported — game still fully playable */}
  },
  setMuted(m){if(this.master)this.master.gain.value=m?0:0.6;},
  tone(freq,dur,type,vol,slideTo,delay){
    if(!this.ctx||!DB.sound)return;
    try{
      const t0=this.ctx.currentTime+(delay||0);
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
      if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
      g.gain.setValueAtTime(vol||0.3,t0);
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      o.connect(g);g.connect(this.master);
      o.start(t0);o.stop(t0+dur+0.02);
    }catch(e){}
  },
  noise(dur,vol,f0,f1,type,delay){
    if(!this.ctx||!DB.sound||!this.noiseBuf)return;
    try{
      const t0=this.ctx.currentTime+(delay||0);
      const src=this.ctx.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
      const flt=this.ctx.createBiquadFilter();flt.type=type||'bandpass';
      flt.frequency.setValueAtTime(f0,t0);
      if(f1)flt.frequency.exponentialRampToValueAtTime(f1,t0+dur);
      flt.Q.value=1;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(0.08,dur*0.3));
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      src.connect(flt);flt.connect(g);g.connect(this.master);
      src.start(t0);src.stop(t0+dur+0.05);
    }catch(e){}
  },
  /* ---- SFX ---- */
  ui(){this.tone(640,0.06,'triangle',0.22);},
  swing(){this.noise(0.12,0.16,400,1600);},
  hit(p){this.tone(140+p*90,0.09,'triangle',0.5);this.noise(0.05,0.22,2200,700);},
  six(){this.tone(523,0.09,'square',0.2);this.tone(659,0.09,'square',0.2,null,0.09);
        this.tone(784,0.16,'square',0.24,null,0.18);this.cheer(1);},
  four(){this.tone(440,0.08,'triangle',0.24);this.tone(587,0.12,'triangle',0.24,null,0.09);this.cheer(0.6);},
  out(){this.tone(160,0.3,'sawtooth',0.32,70);this.noise(0.25,0.28,300,120,'lowpass');this.cheer(0.25,'low');},
  cheer(v,mood){ // crowd swell — filtered noise
    v=v||1;const dur=0.5+v*0.9;
    this.noise(dur,0.12*v+0.05,mood==='low'?420:900,mood==='low'?300:1400);
    if(mood!=='low')this.noise(dur*0.7,0.06*v+0.02,2400,3000,'highpass');
  },
  coin(){this.tone(880,0.07,'sine',0.24);this.tone(1320,0.1,'sine',0.24,null,0.07);},
  bounce(){this.tone(210,0.04,'sine',0.14);},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,0.16,'square',0.2,null,i*0.12));this.cheer(1.2);},
  lose(){[330,262,196].forEach((f,i)=>this.tone(f,0.2,'triangle',0.22,null,i*0.14));},
  firework(){this.noise(0.5,0.13,600,200);this.tone(1200,0.3,'sine',0.07,300);},
  /* ---- soft looping crowd ambience while a match is on ---- */
  startAmbient(){
    if(!this.ctx||this.ambient)return;
    try{
      const src=this.ctx.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;
      const flt=this.ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=420;
      const g=this.ctx.createGain();g.gain.value=0.035;
      src.connect(flt);flt.connect(g);g.connect(this.master);
      src.start();this.ambient=src;
    }catch(e){}
  },
  stopAmbient(){if(this.ambient){try{this.ambient.stop();}catch(e){}this.ambient=null;}}
};

/* =====================================================================
   SECTION 8 · GAME CORE — state machine, deliveries, outcomes, scoring
   ----------------------------------------------------------------------------
   A ball's life:  'pre' (breather) → 'windup' (bowler runs in, cue shows)
                   → 'flight' (ball travels; player taps) → 'aftermath'
                   → next ball / end of match.
   Timing is measured on a game-clock (ms) that slows for slow-motion.
   ===================================================================== */
const VH=()=>Render.L?Render.L.H:600; // viewport height shortcut for physics

/* Ball position along its path (p = 0 at release, 1 at the bat). */
function ballPathX(b,p){
  let x=b.x0;
  if(b.type==='swing')x+=b.curveDir*b.curveAmt*smoothstep(0,0.9,p);   // gradual drift
  else if(b.type==='spin')x+=b.curveDir*b.curveAmt*smoothstep(0.62,1,p); // late snap
  return x;
}
function ballPathY(b,p){
  let y=lerp(b.y0,b.y1,p);
  const H=VH();
  if(b.type==='slow')y-=Math.sin(Math.PI*p)*H*0.055;             // loopy flight
  else if(b.type==='bouncer'&&p>b.bounceT){                       // hops up after pitching
    const q=(p-b.bounceT)/(1-b.bounceT);
    y-=Math.sin(Math.PI*q)*H*0.085;
  }
  return y;
}

const Game={
  state:'menu',            // 'menu' | 'playing' | 'paused' | 'result'
  mode:null,level:1,       // mode: 'super' | 'endless' | 'daily' | 'level'
  clock:0,timeScale:1,slowmoT:0,events:[],
  runs:0,wickets:0,ballNo:0,totalBalls:6,wicketLimit:2,target:0,won:false,
  combo:0,comboMax:0,sixes:0,fours:0,bonusCoins:0,milestones:0,
  history:[],              // per-ball outcome for the HUD dots
  ball:null,curCfg:null,
  swingT:-1,               // clock time the bat swing started
  extraLifeUsed:false,dailyTypes:null,
  stumpFall:0,cheer:0,

  /* ---------------- match setup ---------------- */
  start(mode,lvl){
    this.mode=mode;this.level=lvl||1;
    this.won=false;this.runs=0;this.wickets=0;this.ballNo=0;
    this.combo=0;this.comboMax=0;this.sixes=0;this.fours=0;this.bonusCoins=0;this.milestones=0;
    this.history=[];this.ball=null;this.swingT=-1;this.extraLifeUsed=false;
    this.clock=0;this.timeScale=1;this.slowmoT=0;this.events=[];
    this.stumpFall=0;this.cheer=0;this.dailyTypes=null;
    if(mode==='endless'){this.level=1;this.target=0;this.totalBalls=Infinity;this.wicketLimit=3;}
    else if(mode==='super'){this.level=rndi(3,7);this.totalBalls=6;this.wicketLimit=2;this.target=rndi(9,12);}
    else if(mode==='level'){this.level=lvl;this.totalBalls=6;this.wicketLimit=2;this.target=LVL.target(lvl);}
    else if(mode==='daily'){
      const info=dailyInfo();
      this.level=info.diff;this.totalBalls=6;this.wicketLimit=2;this.target=info.target;
      const rng=mulberry32(todayKey());       // same 6 balls for everyone, every day
      this.dailyTypes=[];for(let i=0;i<6;i++)this.dailyTypes.push(pickType(info.diff,rng));
    }
    this.state='playing';
    UI.closeAll();UI.showHUD(true);UI.updateHUD();UI.renderBallDots();
    AudioSys.ensure();AudioSys.startAmbient();
    this.beginBall();
  },

  /* ---------------- per-ball setup ---------------- */
  beginBall(){
    if(this.mode==='endless')this.level=Math.min(50,1+Math.floor(this.ballNo/5)); // survival ramp
    const type=this.dailyTypes?this.dailyTypes[Math.min(this.ballNo,5)]:pickType(this.level);
    const bt=BALL_TYPES[type];
    const travel=Math.round(LVL.travel(this.level)*bt.travel*rnd(0.96,1.04));
    this.curCfg={
      w1:LVL.w1(this.level)*bt.win,
      w2:LVL.w2(this.level)*bt.win,
      w3:LVL.w3(this.level)*bt.win,
      w4:LVL.w4(this.level)*bt.win,
      outChance:clamp(LVL.outChance(this.level)+bt.outAdd,0.05,0.85)
    };
    const L=Render.L;
    this.ball={
      type,travel,phase:'pre',phaseAt:this.clock,
      releaseAt:0,arrivalAt:0,tapped:false,tapAt:0,dt:0,outcome:null,resolved:false,resolveAt:0,
      x0:L.cx+rnd(-1,1)*bt.xJit*0.5,
      y0:L.releaseY,
      y1:L.hitY+(type==='yorker'?16:type==='bouncer'?-24:0),
      curveDir:Math.random()<0.5?-1:1,
      curveAmt:(type==='swing'?rnd(22,34):type==='spin'?rnd(18,30):0),
      bounceT:0.42,bounced:false,away:null,ballIndex:this.ballNo,
      trail:[],spinAng:0,spinSpd:(type==='spin'?14:6)*rnd(0.8,1.2)*(Math.random()<0.5?-1:1),
      aftermathDur:1000
    };
    this.swingT=-1;this.stumpFall=0;
  },
  enterWindup(){const b=this.ball;b.phase='windup';b.phaseAt=this.clock;},
  release(){const b=this.ball;b.phase='flight';b.releaseAt=this.clock;b.arrivalAt=this.clock+b.travel;
    if(b.tapped)b.resolveAt=b.arrivalAt; /* premature tap already registered */},

  /* ---------------- input ---------------- */
  tap(){
    AudioSys.ensure();
    if(this.state!=='playing')return;
    const b=this.ball;if(!b||b.tapped)return;
    this.swingT=this.clock;AudioSys.swing();
    if(b.phase==='pre'||b.phase==='windup'){        // swung way too early
      b.tapped=true;b.tapAt=this.clock;b.dt=-9999;b.outcome={kind:'early'};return;
    }
    if(b.phase!=='flight')return;
    b.tapped=true;b.tapAt=this.clock;
    b.dt=b.tapAt-b.arrivalAt;                        // + = late, − = early
    b.outcome=this.computeOutcome(b.dt);
    b.resolveAt=Math.max(b.arrivalAt,b.tapAt);
  },

  /* Timing windows → outcome. TWEAK: tweak LVL in SECTION 4, not here. */
  computeOutcome(dt){
    const c=this.curCfg,a=Math.abs(dt);
    if(dt<-380)return{kind:'early'};
    if(a<=c.w1)return{kind:'six'};
    if(a<=c.w2)return{kind:'four'};
    if(a<=c.w3)return{kind:'two'};
    if(a<=c.w4)return{kind:'one'};
    return{kind:'miss',out:Math.random()<c.outChance,how:Math.random()<0.5?'bowled':'caught'};
  },

  /* ---------------- main update (called every frame) ---------------- */
  update(rdt){
    if(this.slowmoT>0){                              // winning-shot slow motion
      this.slowmoT-=rdt;
      this.timeScale=this.slowmoT>140?0.22:lerp(1,0.22,Math.max(0,this.slowmoT)/140);
      if(this.slowmoT<=0)this.timeScale=1;
    }
    const dt=rdt*this.timeScale;
    if(this.state==='playing'){
      this.clock+=dt;
      const b=this.ball;
      if(b){
        if(b.phase==='pre'&&this.clock-b.phaseAt>=(b.ballIndex===0?800:520))this.enterWindup();
        else if(b.phase==='windup'&&this.clock-b.phaseAt>=640)this.release();
        else if(b.phase==='flight'){
          const p=(this.clock-b.releaseAt)/b.travel;
          if(!b.bounced&&b.type==='bouncer'&&p>=b.bounceT){b.bounced=true;AudioSys.bounce();}
          if(!b.resolved){
            let due=false;
            if(b.tapped&&this.clock>=b.resolveAt)due=true;
            else if(!b.tapped&&this.clock>b.arrivalAt+330){ // no shot played → bowled
              b.outcome={kind:'out',how:'bowled',noTap:true};b.resolveAt=this.clock;due=true;
            }
            if(due)this.resolveContact();
          }
        }
        else if(b.phase==='aftermath'&&this.clock-b.phaseAt>=b.aftermathDur)this.afterBall();
      }
      if(this.stumpFall>0&&this.stumpFall<1)this.stumpFall=Math.min(1,this.stumpFall+dt/550);
      for(let i=this.events.length-1;i>=0;i--){       // scheduled game-clock events
        if(this.clock>=this.events[i].at){const e=this.events.splice(i,1)[0];e.fn();}
      }
      this.cheer=Math.max(0,this.cheer-rdt/1200);
    }
    Render.updateFx(dt,rdt);
  },

  /* ---------------- resolve the tap (contact moment) ---------------- */
  resolveContact(){
    const b=this.ball,o=b.outcome,L=Render.L,cx=L.cx,hy=b.y1;
    b.resolved=true;b.phase='aftermath';b.phaseAt=this.clock;
    let kind=o.kind;
    if(kind==='miss'&&!o.out)kind='dot';
    else if(kind==='miss'&&o.out)kind='out';
    b.aftermathDur=kind==='six'?1500:kind==='four'?1200:kind==='out'?1500:950;

    if(kind==='six'){
      this.runs+=6;this.sixes++;this.combo++;this.comboMax=Math.max(this.comboMax,this.combo);
      this.history.push('6');
      Render.big('SIX!','#ffd43b');Render.float(pick(COMM.six),'#ffd43b');
      Render.shake(9);Render.burst(cx,hy,26,['#ffd43b','#ff922b','#ffffff']);
      AudioSys.six();this.cheer=1;this.vibe(50);
      if(equippedBat().sparkle)Render.burst(cx,hy-24,16,['#ffe066','#ffffff']);
      b.away={x:cx,y:hy,vx:rnd(-70,70),vy:-VH()*0.62,g:330,t:0,life:1400};
      if(DB.festival!=='classic')this.events.push({at:this.clock+300,fn:()=>Render.firework()});
    }
    else if(kind==='four'){
      this.runs+=4;this.fours++;this.combo++;this.comboMax=Math.max(this.comboMax,this.combo);
      this.history.push('4');
      Render.big('FOUR!','#69db7c');Render.float(pick(COMM.four),'#69db7c');
      Render.shake(4);Render.burst(cx,hy,14,['#69db7c','#ffffff']);
      AudioSys.four();this.cheer=0.7;this.vibe(30);
      b.away={x:cx,y:hy,vx:rnd(170,260)*(Math.random()<0.5?-1:1),vy:-VH()*0.12,g:150,t:0,life:900};
    }
    else if(kind==='two'){
      this.runs+=2;this.combo=0;this.history.push('2');
      AudioSys.hit(0.5);AudioSys.cheer(0.25);Render.float(pick(COMM.two),'#a5d8ff');
      b.away={x:cx,y:hy,vx:rnd(-140,140),vy:-VH()*0.18,g:260,t:0,life:900};
    }
    else if(kind==='one'){
      this.runs+=1;this.combo=0;this.history.push('1');
      AudioSys.hit(0.3);Render.float(pick(COMM.one),'#a5d8ff');
      b.away={x:cx,y:hy,vx:rnd(-110,110),vy:-VH()*0.15,g:260,t:0,life:850};
    }
    else if(kind==='dot'){
      this.combo=0;this.history.push('•');
      AudioSys.hit(0.12);Render.float(pick(COMM.dot),'#adb5bd');
      b.away={x:ballPathX(b,1),y:hy,vx:rnd(-15,15),vy:VH()*0.35,g:0,t:0,life:450}; // through to keeper
    }
    else if(kind==='early'){
      this.combo=0;this.history.push('•');
      Render.float(pick(COMM.early),'#ffd43b');
      b.away={x:ballPathX(b,1),y:hy,vx:rnd(-15,15),vy:VH()*0.35,g:0,t:0,life:450};
    }
    else if(kind==='out'){
      this.wickets++;this.combo=0;this.history.push('W');
      Render.big('OUT!','#ff6b6b');Render.float(pick(COMM.out),'#ff6b6b');
      Render.shake(7);AudioSys.out();this.vibe([60,50,80]);this.cheer=0.5;
      if(o.how==='bowled'||o.noTap){
        this.stumpFall=0.0001;                        // triggers the stump-break anim
        b.away={x:ballPathX(b,1),y:hy,vx:rnd(-20,20),vy:VH()*0.5,g:0,t:0,life:350};
      }else{                                          // edged — caught behind
        b.away={x:cx+rnd(-30,30),y:hy-10,vx:rnd(-90,90),vy:-VH()*0.38,g:520,t:0,life:1300};
      }
    }

    /* combo pop-up */
    if((kind==='six'||kind==='four')&&this.combo>=2){
      Render.float(pick(COMM.combo).replace('{n}',this.combo),'#ff922b');
    }
    /* endless-survival milestones (+5 coins every 25 runs) */
    if(this.mode==='endless'){
      const m=Math.floor(this.runs/25);
      if(m>this.milestones){
        this.milestones=m;this.bonusCoins+=5;
        Render.float(COMM.milestone[0].replace('{n}',m*25)+' +5🪙','#ffd43b');
        AudioSys.cheer(0.5);
      }
    }
    /* winning shot → slow-motion, then confetti + fanfare */
    if(this.target&&this.runs>=this.target&&!this.won){
      this.won=true;
      this.slowmoT=950;this.timeScale=0.22;
      this.events.push({at:this.clock+700,fn:()=>{Render.confetti();AudioSys.win();}});
    }
    UI.updateHUD();UI.renderBallDots();
  },

  /* ---------------- between balls ---------------- */
  afterBall(){
    this.ballNo++;
    if(this.won){this.endMatch(true);return;}
    if(this.wickets>=this.wicketLimit){
      if(this.mode==='endless'&&!this.extraLifeUsed){UI.offerExtraLife();return;}
      this.endMatch(false);return;
    }
    if(this.mode!=='endless'&&this.ballNo>=this.totalBalls){
      this.endMatch(this.runs>=this.target);return;
    }
    this.beginBall();
  },

  /* ---------------- match end: stars, coins, saves ---------------- */
  endMatch(win){
    this.state='result';this.ball=null;this.events=[];
    AudioSys.stopAmbient();
    const res={
      mode:this.mode,level:this.level,win,
      runs:this.runs,wickets:this.wickets,balls:this.ballNo,
      sixes:this.sixes,fours:this.fours,comboMax:this.comboMax,target:this.target,
      firstClear:false,dailyBonus:false,newBest:false,premiumMult:DB.isPremium
    };
    /* 3-star rating: win with balls to spare (levels & super over) */
    res.stars=0;
    if(this.mode==='level'&&win){
      const left=this.totalBalls-this.ballNo;
      res.stars=left>=2?3:left===1?2:1;
    }
    /* coin economy — TWEAK: every line here is the payout */
    let coins=this.runs+this.sixes*3+this.fours*2+this.bonusCoins;
    if(win)coins+=10;
    if(this.comboMax>=3)coins+=this.comboMax*3;
    if(this.mode==='level'&&win&&!DB.stars[this.level]){coins+=15;res.firstClear=true;}
    if(this.mode==='daily'&&win&&DB.daily.date!==todayKey()){
      coins+=25;res.dailyBonus=true;
      DB.daily={date:todayKey(),done:true,margin:this.runs-this.target};
    }else if(this.mode==='daily'&&win&&this.runs-this.target>(DB.daily.margin||-999)){
      DB.daily.margin=this.runs-this.target;
    }
    res.coins=DB.isPremium?coins*2:coins;
    DB.coins+=res.coins;
    /* persist progress */
    if(this.mode==='level'&&win)DB.stars[this.level]=Math.max(DB.stars[this.level]||0,res.stars);
    if(this.mode==='endless'&&this.runs>DB.best.endless){DB.best.endless=this.runs;res.newBest=true;}
    if(this.mode==='super'&&this.runs>DB.best.super){DB.best.super=this.runs;res.newBest=true;}
    DB.matches++;
    DB.board.push({m:this.mode,s:this.runs,d:shortDate()});
    DB.board.sort((a,b)=>b.s-a.s);DB.board=DB.board.slice(0,10);
    Storage.save();
    UI.showHUD(false);
    UI.showResult(res);
    if(!win)AudioSys.lose();
    /* MONETIZATION HOOK: interstitial after every 3rd match (skipped for premium) */
    if(!DB.isPremium&&DB.matches%3===0){
      setTimeout(()=>{showInterstitialAd(()=>{});},700);
    }
  },

  /* ---------------- pause / resume / quit ---------------- */
  pause(){if(this.state!=='playing')return;this.state='paused';UI.showHUD(false);UI.screen('pause');},
  resume(){if(this.state!=='paused')return;this.state='playing';UI.closeAll();UI.showHUD(true);},
  toMenu(){this.state='menu';this.ball=null;this.events=[];AudioSys.stopAmbient();UI.showHUD(false);UI.screen('menu');},

  vibe(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
};
/* =====================================================================
   SECTION 9 · RENDER — canvas scene + all the "juice".
   Perf notes (low-end Android friendly):
   • crowd is pre-rendered ONCE to an offscreen canvas per stadium/theme
   • particles are hard-capped (~330) and drawn as plain arcs/rects
   • no shadows, no filters, no big gradients per-frame beyond a few
   ===================================================================== */
const Render={
  cv:null,ctx:null,W:0,H:0,dpr:1,L:null,animT:0,
  crowdCv:null,flashes:[],
  parts:[],floats:[],bigs:[],
  shakeMag:0,fwT:0,attr:{burst:false},

  init(){
    this.cv=$('#game');this.ctx=this.cv.getContext('2d');
    const rs=()=>this.resize();
    window.addEventListener('resize',rs);
    window.addEventListener('orientationchange',()=>setTimeout(rs,250));
    this.resize();
  },

  /* Responsive layout — everything anchors to viewport size (portrait-first,
     works in any aspect). No letterboxing: the scene stretches full-bleed.
     Vertical stack: sky strip → stands → ad boards → outfield → pitch. */
  resize(){
    const w=Math.max(320,window.innerWidth),h=Math.max(420,window.innerHeight);
    this.dpr=Math.min(2,window.devicePixelRatio||1);
    this.W=w;this.H=h;
    this.cv.width=Math.round(w*this.dpr);this.cv.height=Math.round(h*this.dpr);
    this.cv.style.width=w+'px';this.cv.style.height=h+'px';
    const skyH=clamp(h*0.05,20,44);                 // visible sky strip (festival themes!)
    const standsH=clamp(h*0.20,96,170);
    this.L={
      W:w,H:h,skyH,standsH,
      boardY:skyH+standsH,fieldTop:skyH+standsH+20,
      pitchTop:h*0.30,pitchBot:h*0.965,cx:w/2,
      pitchTopW:clamp(w*0.09,26,48),pitchBotW:clamp(w*0.40,130,190),
      releaseY:h*0.345,hitY:h*0.815,batY:h*0.845,stumpY:h*0.905
    };
    this.buildCrowd();
  },

  /* ---- pre-render the crowd (called on resize / stadium change) ---- */
  buildCrowd(){
    const L=this.L;if(!L)return;
    const c=document.createElement('canvas');
    c.width=Math.max(2,this.W);c.height=Math.max(2,Math.floor(L.standsH));
    const x=c.getContext('2d');const st=stadiumDef();
    const g=x.createLinearGradient(0,0,0,c.height);
    g.addColorStop(0,shade(st.stands,-38));g.addColorStop(1,shade(st.stands,8));
    x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
    x.fillStyle='rgba(0,0,0,0.35)';                       // tier separators
    x.fillRect(0,c.height*0.33,c.width,3);x.fillRect(0,c.height*0.66,c.width,3);
    for(let yy=10;yy<c.height-4;yy+=11){                  // crowd dots
      const off=((yy/11)|0)%2?6:0;
      for(let xx=6+off;xx<c.width-4;xx+=12){
        if(Math.random()<0.12)continue;                   // empty seats
        x.fillStyle=st.crowd[Math.floor(Math.random()*st.crowd.length)];
        x.beginPath();x.arc(xx,yy+rnd(-2,2),2.6,0,7);x.fill();
      }
    }
    this.crowdCv=c;
    this.flashes=[];                                      // camera-flash spots
    for(let i=0;i<26;i++)this.flashes.push({x:rnd(10,this.W-10),y:rnd(L.skyH+8,L.skyH+L.standsH-8),p:rnd(0,6.28)});
  },

  skyColors(){
    const st=stadiumDef();
    if(DB.festival==='diwali')return['#3b1d54','#ff9540'];   // dusk + diyas
    if(DB.festival==='ipl')return['#070b1f','#16264f'];      // floodlit night
    return[st.sky0,st.sky1];
  },

  /* =================== main draw =================== */
  draw(rdt){
    const ctx=this.ctx,L=this.L,W=this.W,H=this.H;
    if(!ctx||!L)return;
    this.animT+=rdt/1000;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.save();
    if(this.shakeMag>0.3)ctx.translate(rnd(-1,1)*this.shakeMag,rnd(-1,1)*this.shakeMag);
    if(Game.timeScale<0.99){                                 // slow-mo zoom
      const z=1+(1-Game.timeScale)*0.06;
      ctx.translate(W/2,H*0.7);ctx.scale(z,z);ctx.translate(-W/2,-H*0.7);
    }
    this.drawSky(ctx);
    this.drawStands(ctx);
    this.drawBoards(ctx);
    this.drawField(ctx);
    this.drawPitch(ctx);
    this.drawStumps(ctx,L.pitchTop+10,0,true);               // bowler's end
    this.drawFielders(ctx);
    this.drawStumps(ctx,L.stumpY,Game.stumpFall,false);      // batsman's end
    this.drawBatsman(ctx);
    this.drawBowler(ctx);
    if(Game.state==='playing'&&Game.ball)this.drawLiveBall(ctx);
    if(Game.state==='menu')this.drawAttract(ctx);
    this.drawFx(ctx);
    ctx.restore();
    if(Game.timeScale<0.99){                                 // slow-mo vignette
      const v=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
      v.addColorStop(0,'rgba(0,0,0,0)');
      v.addColorStop(1,'rgba(20,5,0,'+(0.5*(1-Game.timeScale)).toFixed(3)+')');
      ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
    }
  },

  drawSky(ctx){
    const L=this.L,sc=this.skyColors();
    const g=ctx.createLinearGradient(0,0,0,L.fieldTop+30);
    g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);
    ctx.fillStyle=g;ctx.fillRect(-40,-40,this.W+80,L.fieldTop+70);
    if(DB.festival!=='classic')this.drawFloods(ctx);
    if(DB.festival==='diwali'){                              // glowing diyas on the ledge
      for(let i=0;i<6;i++){
        const x=this.W*(i+0.5)/6+Math.sin(this.animT*0.7+i)*10;
        const y=L.skyH+L.standsH-6+Math.sin(this.animT*1.3+i*2)*2;
        ctx.fillStyle='rgba(255,170,60,'+(0.5+0.3*Math.sin(this.animT*5+i)).toFixed(3)+')';
        ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
      }
    }
  },
  drawFloods(ctx){
    const L=this.L,headY=L.skyH+10;
    [this.W*0.16,this.W*0.84].forEach(x=>{
      ctx.strokeStyle='#495057';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,L.boardY-10);ctx.stroke();
      ctx.fillStyle='#212529';rr(ctx,x-16,headY-8,32,16,4);ctx.fill();
      ctx.fillStyle='#fff9db';
      for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x-10+k*7,headY,2.4,0,7);ctx.fill();}
      const gl=ctx.createRadialGradient(x,headY,4,x,headY,60);
      gl.addColorStop(0,'rgba(255,248,200,0.5)');gl.addColorStop(1,'rgba(255,248,200,0)');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,headY,60,0,7);ctx.fill();
    });
  },
  drawStands(ctx){
    const L=this.L;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,L.skyH-3,this.W,3); // stadium roof line
    if(this.crowdCv)ctx.drawImage(this.crowdCv,0,L.skyH);
    const boost=Game.cheer;                                  // camera flashes go wild on big moments
    for(const f of this.flashes){
      const a=Math.abs(Math.sin(this.animT*2.2+f.p));
      if(a>0.72||boost>0.1){
        ctx.fillStyle='rgba(255,255,255,'+Math.min(0.9,a*(0.25+boost*0.75)).toFixed(3)+')';
        ctx.beginPath();ctx.arc(f.x,f.y,2.2,0,7);ctx.fill();
      }
    }
  },
  drawBoards(ctx){
    const L=this.L,st=stadiumDef(),y=L.boardY,h=20;
    ctx.fillStyle=st.board;ctx.fillRect(0,y,this.W,h);
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,y,this.W,2);
    let txt='SUPER OVER BLITZ ★ NAMASTE CRICKET ★ CHAI POINT ★ GULLY GANG ★ ';
    if(DB.festival==='diwali')txt='शुभ दीपावली ★ '+txt;
    if(DB.festival==='ipl')txt='NEON NIGHT LEAGUE ★ '+txt;
    ctx.font='700 11px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.textBaseline='middle';
    const w=ctx.measureText(txt).width||300;
    const off=-((this.animT*26)%w);                          // scrolling ad boards
    for(let x=off;x<this.W;x+=w)ctx.fillText(txt,x,y+h/2+1);
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(0,y+h-2,this.W,2);
  },
  drawField(ctx){
    const L=this.L,st=stadiumDef();
    const g=ctx.createLinearGradient(0,L.fieldTop,0,this.H);
    g.addColorStop(0,st.field);g.addColorStop(1,shade(st.field,-14));
    ctx.fillStyle=g;ctx.fillRect(-40,L.fieldTop,this.W+80,this.H-L.fieldTop+40);
    ctx.fillStyle='rgba(255,255,255,0.05)';                  // mowing stripes
    const band=(this.H-L.fieldTop)/9;
    for(let i=0;i<9;i+=2)ctx.fillRect(-40,L.fieldTop+i*band,this.W+80,band);
    if(DB.festival==='ipl'){ctx.fillStyle='rgba(5,10,30,0.22)';ctx.fillRect(-40,L.fieldTop,this.W+80,this.H-L.fieldTop+40);}
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=3; // boundary rope
    ctx.beginPath();ctx.ellipse(L.cx,L.fieldTop+26,Math.min(this.W*0.49,this.W/2-4),20,0,0,7);ctx.stroke();
  },
  pitchW(y){const L=this.L;const p=clamp((y-L.pitchTop)/(L.pitchBot-L.pitchTop),0,1);return lerp(L.pitchTopW,L.pitchBotW,p);},
  drawPitch(ctx){
    const L=this.L;
    ctx.fillStyle='#d9b380';
    ctx.beginPath();
    ctx.moveTo(L.cx-L.pitchTopW/2,L.pitchTop);ctx.lineTo(L.cx+L.pitchTopW/2,L.pitchTop);
    ctx.lineTo(L.cx+L.pitchBotW/2,L.pitchBot);ctx.lineTo(L.cx-L.pitchBotW/2,L.pitchBot);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(120,80,30,0.35)';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=2;  // creases
    [L.pitchTop+12,L.batY-14].forEach(y=>{
      const w=this.pitchW(y);
      ctx.beginPath();ctx.moveTo(L.cx-w/2,y);ctx.lineTo(L.cx+w/2,y);ctx.stroke();
    });
    ctx.fillStyle='rgba(140,100,50,0.18)';                    // worn patch
    ctx.beginPath();ctx.ellipse(L.cx,L.hitY-6,L.pitchTopW*0.8,10,0,0,7);ctx.fill();
  },
  drawFielders(ctx){
    const L=this.L,st=stadiumDef();
    const P=[[0.12,0.30],[0.88,0.30],[0.05,0.52],[0.95,0.52],[0.27,0.22],[0.73,0.22]];
    P.forEach((p,i)=>{
      const x=p[0]*this.W+Math.sin(this.animT*1.4+i*2)*2;
      const y=L.fieldTop+(this.H-L.fieldTop)*p[1];
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.beginPath();ctx.ellipse(x,y+9,7,2.5,0,0,7);ctx.fill();
      ctx.fillStyle=shade(st.board,10);rr(ctx,x-4,y-8,8,14,3);ctx.fill();
      ctx.fillStyle='#ffd8a8';ctx.beginPath();ctx.arc(x,y-11,3.4,0,7);ctx.fill();
    });
  },
  drawStumps(ctx,y,fall,small){
    const L=this.L;const gap=small?9:7,hh=small?18:26;
    ctx.strokeStyle='#f4f1e0';ctx.lineWidth=small?2.5:3.5;ctx.lineCap='round';
    for(let i=-1;i<=1;i++){
      const x=L.cx+i*gap;
      ctx.save();ctx.translate(x,y);
      if(fall>0)ctx.rotate(fall*1.5*i);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-hh*(1-fall*0.4));ctx.stroke();
      ctx.restore();
    }
    if(fall>0&&fall<1){                                       // bails flying
      ctx.fillStyle='#ffd43b';
      for(let i=0;i<2;i++){
        const bx=L.cx+(i?6:-6)+fall*26*(i?1:-1);
        ctx.fillRect(bx,y-hh-fall*22,5,2.5);
      }
    }else if(fall===0){
      ctx.fillStyle='#ffd43b';
      ctx.fillRect(L.cx-7,y-hh-3,5,2.5);ctx.fillRect(L.cx+2,y-hh-3,5,2.5);
    }
  },
  drawBatsman(ctx){
    const L=this.L,cx=L.cx,y=L.batY;
    /* swing animation state */
    let ang=-0.5+Math.sin(this.animT*2.1)*0.09;              // idle waggle
    if(Game.swingT>=0){
      const sw=clamp((Game.clock-Game.swingT)/240,0,3);
      if(sw<1)ang=lerp(-0.6,2.35,easeOutQuad(Math.min(1,sw*1.25)));
      else if(sw<2.2)ang=lerp(2.35,-0.5,(sw-1)/1.2);
    }
    if(Game.state==='menu'){                                  // attract-mode swing
      const a=this.attrPhase();
      if(a.swing)ang=lerp(-0.6,2.35,easeOutQuad(a.swingP));
    }
    const bat=equippedBat();
    ctx.fillStyle='rgba(0,0,0,0.25)';                         // shadow
    ctx.beginPath();ctx.ellipse(cx,y+14,24,6,0,0,7);ctx.fill();
    ctx.fillStyle='#ffe8cc';ctx.strokeStyle='#c3a37a';ctx.lineWidth=1.5;  // pads
    rr(ctx,cx-12,y-26,9,30,4);ctx.fill();ctx.stroke();
    rr(ctx,cx+3,y-26,9,30,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#343a40';rr(ctx,cx-12,y+2,9,5,2);ctx.fill();rr(ctx,cx+3,y+2,9,5,2);ctx.fill();
    ctx.fillStyle='#1864ab';rr(ctx,cx-13,y-56,26,32,8);ctx.fill();        // India-blue torso
    ctx.fillStyle='#ff9933';ctx.fillRect(cx-13,y-40,26,3);                 // saffron trim
    ctx.fillStyle='#ffd8a8';ctx.beginPath();ctx.arc(cx,y-66,8.5,0,7);ctx.fill(); // head
    ctx.fillStyle='#212529';ctx.beginPath();ctx.arc(cx,y-67,9,Math.PI*0.95,Math.PI*2.05);ctx.fill();
    ctx.fillRect(cx-9,y-67,18,3);                                          // helmet
    ctx.strokeStyle='#1864ab';ctx.lineWidth=5;ctx.lineCap='round';         // arm
    ctx.beginPath();ctx.moveTo(cx+4,y-50);ctx.lineTo(cx+15,y-44);ctx.stroke();
    /* the bat — colours from the equipped bat */
    const px=cx+17,py=y-44;
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    ctx.fillStyle='#4a2f1d';rr(ctx,-2,-24,4,22,2);ctx.fill();              // handle
    const bg=ctx.createLinearGradient(-7,0,7,0);
    bg.addColorStop(0,bat.c[0]);bg.addColorStop(1,bat.c[1]);
    ctx.fillStyle=bg;rr(ctx,-6.5,-60,13,38,5);ctx.fill();                 // blade
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  },
  drawBowler(ctx){
    const L=this.L;let prog=0,visible=true;
    if(Game.state==='playing'&&Game.ball){
      const b=Game.ball;
      if(b.phase==='pre')prog=0;
      else if(b.phase==='windup')prog=clamp((Game.clock-b.phaseAt)/640,0,1);
      else prog=1;
    }else if(Game.state==='result')visible=false;
    if(!visible)return;
    const y=lerp(L.releaseY-78,L.releaseY-6,easeOutQuad(prog));
    const x=L.cx+L.pitchTopW*0.55;
    const step=(prog>0&&prog<1)?Math.sin(prog*Math.PI*6):0;
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(x,y+12,9,3,0,0,7);ctx.fill();
    ctx.strokeStyle='#e8590c';ctx.lineWidth=5;ctx.lineCap='round';         // legs (run cycle)
    ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x-4+step*4,y+10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+4-step*4,y+10);ctx.stroke();
    ctx.fillStyle='#e8590c';rr(ctx,x-6,y-24,12,20,5);ctx.fill();           // torso
    ctx.fillStyle='#ffd8a8';ctx.beginPath();ctx.arc(x,y-29,5,0,7);ctx.fill();
    let armA=-2.4;                                                          // bowling arm
    if(prog>0.7)armA=lerp(-2.4,0.6,(prog-0.7)/0.3);
    else if(prog>0)armA=-2.4+Math.sin(prog*Math.PI*4)*0.5;
    ctx.strokeStyle='#e8590c';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(x,y-20);ctx.lineTo(x+Math.cos(armA)*11,y-20+Math.sin(armA)*11);ctx.stroke();
  },
  /* the red cherry — used by live balls AND the attract mode */
  ballSprite(ctx,x,y,r,spinAng,type,alpha){
    if(alpha===undefined)alpha=1;
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#c92a2a';
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=Math.max(1,r*0.14); // seam
    ctx.beginPath();ctx.arc(x,y,r*0.62,spinAng,spinAng+2.2);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*0.62,spinAng+Math.PI,spinAng+Math.PI+2.2);ctx.stroke();
    ctx.fillStyle=TYPE_COLORS[type]||'#ffffff';                                 // type-coloured marker
    ctx.beginPath();ctx.arc(x+Math.cos(spinAng*1.7)*r*0.35,y+Math.sin(spinAng*1.7)*r*0.35,Math.max(1.2,r*0.18),0,7);ctx.fill();
    ctx.globalAlpha=1;
  },
  drawLiveBall(ctx){
    const L=this.L,b=Game.ball;if(!b)return;
    /* bowling-type cue pill — the subtle "read the delivery" hint */
    if(b.phase==='windup'||(b.phase==='flight'&&(Game.clock-b.releaseAt)/b.travel<0.45))this.drawCue(ctx);
    if(b.phase==='pre'||b.phase==='windup'){                  // ball in the bowler's hand
      this.ballSprite(ctx,L.cx+L.pitchTopW*0.55+8,L.releaseY-16,5,b.spinAng,b.type,0.9);
      return;
    }
    if(b.phase==='flight'){
      const p=clamp((Game.clock-b.releaseAt)/b.travel,-0.05,1.35);
      const pp=clamp(p,0,1);
      const x=ballPathX(b,pp),y=ballPathY(b,pp);
      const r=lerp(5.5,11,pp);
      if(p>=0&&p<=1){b.trail.push({x,y});if(b.trail.length>11)b.trail.shift();}
      const gy=lerp(L.releaseY+26,L.hitY+12,pp);              // ground shadow
      ctx.fillStyle='rgba(0,0,0,'+(0.18-pp*0.06).toFixed(3)+')';
      ctx.beginPath();ctx.ellipse(x,gy,r*0.85,r*0.3,0,0,7);ctx.fill();
      this.drawTrail(ctx,b,r);
      this.drawRing(ctx,pp);
      this.ballSprite(ctx,x,y,r,b.spinAng,b.type,1);
    }else if(b.phase==='aftermath'&&b.away&&b.away.t<b.away.life){
      const a=b.away,al=1-a.t/a.life;
      this.ballSprite(ctx,a.x,a.y,10*al+3,b.spinAng,b.type,al);
    }
  },
  drawTrail(ctx,b,r){
    if(!b.trail.length)return;
    const tr=equippedTrail();
    for(let i=0;i<b.trail.length-1;i++){
      const q=(i+1)/b.trail.length;
      let col;
      if(tr.id==='rainbow')col='hsl('+((this.animT*140+i*26)%360)+',90%,60%)';
      else if(tr.id==='none')col='#c92a2a';
      else col=q>0.5?tr.c[0]:tr.c[1];
      ctx.globalAlpha=tr.id==='none'?q*0.22:q*0.5;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(b.trail[i].x,b.trail[i].y,r*q*0.85,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
  },
  drawRing(ctx,p){                                            // shrinking timing ring
    const L=this.L;
    if(p<=0||p>1.12)return;
    const rMax=Math.min(96,this.W*0.24);
    const r=34+Math.pow(1-clamp(p,0,1),1.6)*rMax;
    const near=p>0.78&&p<1.18;
    ctx.strokeStyle=near?'#51cf66':'rgba(255,255,255,0.45)';
    ctx.lineWidth=near?4:2;
    ctx.beginPath();ctx.arc(L.cx,L.hitY,r,0,7);ctx.stroke();
    if(near){ctx.strokeStyle='rgba(81,207,102,0.35)';ctx.lineWidth=8;
      ctx.beginPath();ctx.arc(L.cx,L.hitY,r,0,7);ctx.stroke();}
    ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1.5;   // hit zone
    ctx.beginPath();ctx.ellipse(L.cx,L.hitY,36,9,0,0,7);ctx.stroke();
  },
  drawCue(ctx){
    const L=this.L,b=Game.ball;if(!b)return;
    const label=BALL_TYPES[b.type].icon+' '+t('bt_'+b.type);
    ctx.font='800 13px system-ui,sans-serif';
    const w=ctx.measureText(label).width+26;
    const x=L.cx-w/2,y=L.pitchTop-30;
    ctx.fillStyle='rgba(8,10,18,0.72)';rr(ctx,x,y,w,24,12);ctx.fill();
    ctx.strokeStyle=TYPE_COLORS[b.type];ctx.lineWidth=2;rr(ctx,x,y,w,24,12);ctx.stroke();
    ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.textAlign='center';
    ctx.fillText(label,L.cx,y+13);
    ctx.textAlign='left';
  },

  /* ---- attract mode: the stadium plays itself behind the menus ---- */
  attrPhase(){
    const ms=(this.animT*1000)%3600;
    return{ms,
      ball:ms>=600&&ms<1800,p:clamp((ms-600)/1200,0,1),
      swing:ms>=1560&&ms<2300,swingP:clamp((ms-1560)/280,0,1),
      burst:ms>=1740&&ms<1780,gone:ms>=1800&&ms<3100};
  },
  drawAttract(ctx){
    const L=this.L,a=this.attrPhase();
    if(a.ball){
      const x=L.cx,y=lerp(L.releaseY,L.hitY,a.p),r=lerp(5.5,11,a.p);
      this.ballSprite(ctx,x,y,r,this.animT*8,'fast',0.9);
    }else if(a.gone){
      const q=(a.ms-1800)/1300;
      ctx.globalAlpha=Math.max(0,1-q);
      this.ballSprite(ctx,L.cx-40*q,L.hitY-q*this.H*0.7,11*(1-q*0.4),this.animT*8,'fast',Math.max(0,1-q));
      ctx.globalAlpha=1;
    }
    if(a.burst&&!this.attr.burst){
      this.attr.burst=true;
      this.burst(L.cx,L.hitY,16,['#ffd43b','#ff922b']);
      this.big('SIX!','#ffd43b');
    }
    if(a.ms<600)this.attr.burst=false;
  },

  /* =================== particles / floaters / big text =================== */
  burst(x,y,n,cols){
    for(let i=0;i<n;i++){
      if(this.parts.length>320)return;
      const a=rnd(0,6.28),sp=rnd(60,240);
      this.parts.push({type:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:300,
        t:0,life:rnd(380,700),color:pick(cols),size:rnd(2,4.5),ph:rnd(0,6),flut:true});
    }
  },
  confetti(){
    const cols=['#ff9933','#ffffff','#138808','#ffd43b','#ff6b6b','#4dabf7',stadiumDef().accent];
    for(let i=0;i<130;i++){
      if(this.parts.length>330)break;
      this.parts.push({type:'confetti',x:rnd(0,this.W),y:rnd(-this.H*0.25,-10),
        vx:rnd(-30,30),vy:rnd(80,190),g:40,t:0,life:rnd(2600,3800),
        color:pick(cols),size:rnd(5,9),rot:rnd(0,6.28),rv:rnd(-6,6),ph:rnd(0,6.28)});
    }
  },
  firework(){
    const x=rnd(this.W*0.15,this.W*0.85),y=rnd(this.H*0.06,this.H*0.24);
    const cols=DB.festival==='ipl'?['#4dabf7','#e599f7','#99e9f2']:['#ffd43b','#ff922b','#ff6b6b','#ffe066'];
    this.burst(x,y,24,cols);
    AudioSys.firework();
  },
  big(text,color){this.bigs.push({text,color,t:0,life:1050});},
  float(text,color){if(this.L)this.floats.push({text,color,x:this.L.cx+rnd(-26,26),y:this.L.batY-130,t:0,life:1250});},
  shake(m){this.shakeMag=Math.max(this.shakeMag,m);},

  updateFx(dt,rdt){
    const s=dt/1000;
    const b=Game.ball;                                        // ball spin + hit physics
    if(b){
      b.spinAng+=b.spinSpd*s;
      if(b.away&&b.away.t<b.away.life){
        const a=b.away;a.t+=s;a.x+=a.vx*s;a.y+=a.vy*s;a.vy+=a.g*s;
      }
    }
    for(let i=this.parts.length-1;i>=0;i--){
      const p=this.parts[i];p.t+=dt;
      if(p.t>=p.life){this.parts.splice(i,1);continue;}
      p.x+=p.vx*s;p.y+=p.vy*s;p.vy+=p.g*s;
      if(p.type==='confetti'){p.rot+=p.rv*s;p.x+=Math.sin(p.t/130+p.ph)*22*s;}
      else if(p.flut)p.x+=Math.sin(p.t/90+p.ph)*30*s;
    }
    for(let i=this.floats.length-1;i>=0;i--){this.floats[i].t+=dt;if(this.floats[i].t>=this.floats[i].life)this.floats.splice(i,1);}
    for(let i=this.bigs.length-1;i>=0;i--){this.bigs[i].t+=dt;if(this.bigs[i].t>=this.bigs[i].life)this.bigs.splice(i,1);}
    this.shakeMag=Math.max(0,this.shakeMag-rdt*0.012);
    if(DB.festival!=='classic'&&Game.state==='menu'){          // ambient fireworks in menus
      this.fwT+=rdt;
      if(this.fwT>2400){this.fwT=0;this.firework();}
    }
  },
  drawFx(ctx){
    const W=this.W,H=this.H;
    for(const p of this.parts){
      const a=1-p.t/p.life;if(a<=0)continue;
      ctx.globalAlpha=a;
      if(p.type==='confetti'){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size*0.7,p.size,p.size*1.4);
        ctx.restore();
      }else{
        ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+0.5,0,7);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const f of this.floats){                              // Hinglish commentary
      const q=f.t/f.life;
      const a=q<0.15?q/0.15:1-Math.max(0,(q-0.6)/0.4);
      ctx.globalAlpha=clamp(a,0,1);
      ctx.font='800 16px system-ui,sans-serif';
      ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=3;
      ctx.strokeText(f.text,f.x,f.y-q*46);
      ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y-q*46);
    }
    ctx.globalAlpha=1;
    for(const b of this.bigs){                                // SIX! / FOUR! / OUT!
      const q=b.t/b.life;
      const sc=q<0.25?easeOutBack(q/0.25):1;
      const a=q>0.72?1-(q-0.72)/0.28:1;
      ctx.globalAlpha=clamp(a,0,1);
      ctx.save();ctx.translate(W/2,H*0.30);ctx.scale(sc,sc);
      ctx.font='900 '+Math.round(W*0.16)+'px system-ui,sans-serif';
      ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=7;ctx.strokeText(b.text,0,0);
      ctx.fillStyle=b.color;ctx.fillText(b.text,0,0);
      ctx.restore();
    }
    ctx.globalAlpha=1;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
};

let toastTimer=null;
function toast(msg){
  const el=$('#toast');if(!el)return;
  el.textContent=msg;el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add('hidden'),1900);
}
function starTotal(){let s=0;for(const k in DB.stars)s+=DB.stars[k];return s;}
function dailyAvailable(){return DB.login.date!==todayKey();}

const UI={
  cur:null,_res:null,_doubled:false,_tut:null,

  /* ---------- screen router ---------- */
  screen(name){
    const host=$('#screens');
    host.innerHTML='';
    if(!name){this.cur=null;return;}
    const fn=this['scr_'+name];
    host.innerHTML='<div class="screen" data-scr="'+name+'">'+(fn?fn.call(this):'')+'</div>';
    this.cur=name;
    this.bind(host);
  },
  closeAll(){this.screen(null);$('#modalHost').innerHTML='';},
  modal(html){
    $('#modalHost').innerHTML='<div class="modalScr"><div class="modal">'+html+'</div></div>';
    this.bind($('#modalHost'));

  closeModal(){$('#modalHost').innerHTML='';},
  bind(root){
    root.querySelectorAll('[data-act]').forEach(el=>{
      el.addEventListener('click',()=>{AudioSys.ensure();AudioSys.ui();this.act(el.dataset.act);});
    });
  },

  /* ---------- action router: every button goes through here ---------- */
  act(a){
    const i=a.indexOf(':'),op=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);
    switch(op){
      case 'nav':
        if(arg==='menu')Game.toMenu();else this.screen(arg);break;
      case 'mode':Game.start(arg);break;
      case 'level':Game.start('level',parseInt(arg,10));break;
      case 'pause':Game.pause();break;
      case 'resume':Game.resume();break;
      case 'restart':Game.start(Game.mode,Game.level);break;
      case 'quit':Game.toMenu();break;
      case 'mute':toggleSound();if(this.cur)this.screen(this.cur);break;
      case 'lang':DB.lang=arg;Storage.save();this.screen(this.cur);break;
      case 'festival':DB.festival=arg;Storage.save();Render.buildCrowd();this.screen(this.cur);break;
      case 'buy':Shop.buy(arg);break;
      case 'equip':Shop.equip(arg,false);break;
      case 'buyPremium':Shop.buyPremium();break;
      case 'confirmPremium':Shop.confirmPremium();break;
      case 'restore':toast(t('restoreNote'));break;
      case 'again':Game.start(Game.mode,Game.level);break;
      case 'double':this.doubleCoins();break;
      case 'share':shareScore(shareText(this._res));break;
      case 'claim':this.claimDaily(parseInt(arg,10)||20);break;
      case 'extraAd':this.grantExtraLife();break;
      case 'extraNo':UI.closeModal();Game.endMatch(false);break;
      case 'resetAsk':
        this.modal('<div style="font-size:40px">🗑️</div><h2>'+t('resetProgress')+'</h2>'+
          '<p>'+t('resetConfirm')+'</p>'+
          '<button class="btn danger" data-act="resetDo">'+t('resetProgress')+'</button>'+
          '<button class="btn ghost" data-act="closeModal">'+t('noThanks')+'</button>');
        break;
      case 'resetDo':
        Storage.wipe();Render.buildCrowd();this.closeModal();toast(t('resetDone'));this.screen('menu');break;
      case 'closeModal':this.closeModal();break;
      case 'tutNext':this._tut.i++;this._tutSlide();break;

/* ---------- share score: Web Share API → clipboard → toast fallback ---------- */
function shareText(res){
  if(!res)return'🏏 Super Over Blitz!';
  let s='🏏 Super Over Blitz: '+res.runs+' runs';
  if(res.mode==='level')s+=' (Level '+res.level+')';
  if(res.mode==='endless')s+=' survival';
  if(res.win)s+=' — WIN! 🏆';
  return s+' Can you beat me? #SuperOverBlitz';
}
async function shareScore(text){
  try{
    if(navigator.share){await navigator.share({title:'Super Over Blitz',text});return;}
  }catch(e){/* user cancelled or unsupported → fall through */}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);toast(t('copied'));return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    toast(t('copied'));return;
  }catch(e){}
  toast(text.length>46?text.slice(0,46)+'…':text);
}
/* =====================================================================
   SECTION 11 · INPUT + BOOT — touch / mouse / spacebar, pause, main loop
   ===================================================================== */
function toggleSound(){
  DB.sound=!DB.sound;Storage.save();
  AudioSys.ensure();AudioSys.setMuted(!DB.sound);
  syncMuteIcons();
}
function syncMuteIcons(){
  const b=$('#hud [data-hud="mute"]');
  if(b)b.textContent=DB.sound?'🔊':'🔇';
}
function initInput(){
  /* one-tap swing: touch, mouse and pen all arrive as pointerdown */
  $('#tapzone').addEventListener('pointerdown',e=>{e.preventDefault();Game.tap();});
  /* any tap anywhere also unlocks Web Audio on iOS */
  document.addEventListener('pointerdown',()=>AudioSys.ensure(),{passive:true});
  /* keyboard: SPACE = shot (or Play Again on the result screen), ESC = pause */
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.key===' '){
      e.preventDefault();
      if(Game.state==='playing')Game.tap();
      else if(Game.state==='result'&&UI.cur==='result')UI.act('again');
      return;
    }
    if(e.key==='Escape'){
      if(Game.state==='playing')Game.pause();
      else if(Game.state==='paused')Game.resume();
    }
    if(e.key==='Enter'&&Game.state==='result'&&UI.cur==='result')UI.act('again');
  });
  /* HUD buttons (pause / mute) */
  $('#hud').addEventListener('click',e=>{
    const b=e.target.closest('[data-hud]');if(!b)return;
    AudioSys.ensure();
    if(b.dataset.hud==='pause'){AudioSys.ui();Game.pause();}
    else if(b.dataset.hud==='mute'){toggleSound();}
  });
  /* auto-pause when the tab/app goes to background */
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&Game.state==='playing')Game.pause();
  });
  /* stop long-press menus / pinch zoom on the game surface */
  $('#stage').addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---------- boot ---------- */
function boot(){
  Render.init();
  initInput();
  syncMuteIcons();
  UI.screen('menu');
  if(!DB.tutorial)UI.tutorial(true);            // first launch → tutorial
  else if(dailyAvailable())UI.showDailyReward();// returning player → daily reward
  requestAnimationFrame(loop);
}
let _last=performance.now();
function loop(now){
  const rdt=Math.min(50,now-_last);             // clamp: tab-switch safety
  _last=now;
  Game.update(rdt);
  Render.draw(rdt);
  requestAnimationFrame(loop);
}
boot();
</script>
